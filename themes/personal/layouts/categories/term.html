{{ define "main" }}
<section class="category-posts">
    <header class="mb-5">
        <h1 class="mb-3">{{ .Title }}</h1>
        {{ $n := len .Pages }}
        <p class="text-muted">{{ $n }} post{{ if ne $n 1 }}s{{ end }} in this category</p>
    </header>

    <div class="posts">
        {{ range .Pages }}
        <article class="post-summary mb-5 pb-3 border-bottom">
            <h2 class="mb-2"><a href="{{ .Permalink }}" class="text-decoration-none">{{ .Title }}</a></h2>
            <time datetime="{{ .Date.Format "2006-01-02" }}" class="d-block small text-muted mb-3">{{ .Date.Format "January 2, 2006" }}</time>
            <p class="mb-3">{{ .Summary }}</p>
            <a href="{{ .Permalink }}" class="text-decoration-none btn btn-outline-primary btn-sm">Read more →</a>
        </article>
        {{ end }}
    </div>
</section>
{{ end }}
