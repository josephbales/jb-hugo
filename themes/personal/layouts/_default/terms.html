{{ define "main" }}
<section class="categories-list">
    <header class="mb-5">
        <h1 class="mb-3">{{ .Title }}</h1>
        <p class="text-muted">Browse blog posts by category</p>
    </header>

    <div class="categories-grid">
        {{ range .Data.Terms.Alphabetical }}
        <div class="category-card p-3 mb-3 border rounded">
            <h3 class="mb-2">
                <a href="{{ .Page.RelPermalink }}" class="text-decoration-none">{{ .Page.LinkTitle }}</a>
            </h3>
            <p class="text-muted mb-0">{{ .Count }} post{{ if ne .Count 1 }}s{{ end }}</p>
        </div>
        {{ end }}
    </div>
</section>
{{ end }}
